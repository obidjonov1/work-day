<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ish kunlari hisoblagichi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #f4f5f7);
    color: var(--tg-theme-text-color, #222);
    margin: 0;
    padding: 16px;
  }
  .card {
    background: var(--tg-theme-secondary-bg-color, #fff);
    border-radius: 16px;
    padding: 20px;
    max-width: 440px;
    margin: 0 auto;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button {
    flex: 1; padding: 8px 0; border: none; border-radius: 8px;
    background: #eef1f5; color: #666; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: #4f7cff; color: #fff; font-weight: 600; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .header button.nav {
    background: #eef1f5; border: none; border-radius: 8px; width: 36px; height: 36px;
    font-size: 18px; cursor: pointer; color: #333;
  }
  .header h2 { margin: 0; font-size: 18px; text-transform: capitalize; }
  .weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 12px; color: #999; margin-bottom: 8px;
  }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 14px; cursor: pointer; color: #444;
    background: #f7f8fa; user-select: none;
  }
  .day.empty { visibility: hidden; }
  .day.worked { background: #4f7cff; color: #fff; font-weight: 600; }
  .summary {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
  }
  .summary .count b { font-size: 22px; color: #4f7cff; }
  .reset {
    background: none; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px;
    font-size: 13px; color: #888; cursor: pointer;
  }
  .status { font-size: 12px; text-align: center; margin-top: 8px; min-height: 16px; font-weight: 600; }
  .status.ok { color: #2ecc71; }
  .status.fail { color: #e74c3c; }
  .salaryRow {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .salaryRow label { font-size: 14px; color: #333; white-space: nowrap; }
  .salaryRow input {
    flex: 1; min-width: 90px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; text-align: right; background: #f7f8fa; color: #222;
  }
  .salaryRow .unit { font-size: 12px; color: #999; }
  .doneBtn {
    background: #4f7cff; color: #fff; border: none; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .yearRow {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 4px;
    border-bottom: 1px solid #f0f0f0; font-size: 14px; gap: 8px;
  }
  .yearRow .mName { flex: 1.2; }
  .yearRow .mDays { flex: 1; text-align: right; color: #4f7cff; font-weight: 600; }
  .yearRow .mSalary { flex: 1.4; text-align: right; color: #666; }
  .yearTotal {
    margin-top: 14px; padding-top: 14px; border-top: 2px solid #eee;
    display: flex; flex-direction: column; gap: 6px; font-size: 16px; font-weight: 600;
  }
  .yearTotal .row { display: flex; justify-content: space-between; }
  .yearTotal b { color: #4f7cff; font-size: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="tabs">
    <button id="tabMonth" class="active" onclick="showView('month')">Oylik</button>
    <button id="tabYear" onclick="showView('year')">Yillik hisobot</button>
  </div>

  <div id="monthView">
    <div class="header">
      <button class="nav" onclick="changeMonth(-1)">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="nav" onclick="changeMonth(1)">›</button>
    </div>
    <div class="weekdays"><div>Du</div><div>Se</div><div>Ch</div><div>Pa</div><div>Ju</div><div>Sh</div><div>Ya</div></div>
    <div class="days" id="daysGrid"></div>
    <div class="summary">
      <div class="count">Ishlagan kunlar: <b id="workedCount">0</b></div>
      <button class="reset" onclick="resetMonth()">Tozalash</button>
    </div>
    <div class="salaryRow">
      <label for="salaryInput">Oylik maosh:</label>
      <input type="text" id="salaryInput" placeholder="0" inputmode="numeric" oninput="onSalaryInput()" onblur="onSalaryChange()">
      <span class="unit">won</span>
      <button class="doneBtn" onclick="onSalaryDone()">Tayyor</button>
    </div>
    <div class="status" id="statusMsg"></div>
  </div>

  <div id="yearView" style="display:none;">
    <div class="header">
      <button class="nav" onclick="changeYear(-1)">‹</button>
      <h2 id="yearLabel"></h2>
      <button class="nav" onclick="changeYear(1)">›</button>
    </div>
    <div id="yearList"></div>
    <div class="yearTotal">
      <div class="row"><span>Yillik jami kun</span><b id="yearTotalCount">0</b></div>
      <div class="row"><span>Yillik jami oylik</span><b id="yearTotalSalary">0</b></div>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

let current = new Date();
current.setDate(1);
let viewYear = current.getFullYear();
let workedData = {};
let salaryData = {};

const monthNames = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];

// Telegram CloudStorage keys allow only letters, digits, _ and - (no colons)
function keyFor(y, m) { return "worked_" + y + "_" + m; }
function salaryKeyFor(y, m) { return "salary_" + y + "_" + m; }
function dateStr(y, m, d) { return y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0"); }

const hasCloud = !!(tg && tg.CloudStorage);

function cloudGet(key) {
  return new Promise((resolve) => {
    if (!hasCloud) return resolve(localStorage.getItem(key));
    tg.CloudStorage.getItem(key, (err, value) => {
      if (err) resolve(localStorage.getItem(key));
      else resolve(value || null);
    });
  });
}

function cloudSet(key, value) {
  return new Promise((resolve, reject) => {
    try { localStorage.setItem(key, value); } catch(e) {}
    if (!hasCloud) return resolve(true);
    tg.CloudStorage.setItem(key, value, (err, success) => {
      if (err || !success) reject(new Error(err || "CloudStorage rad etdi"));
      else resolve(true);
    });
  });
}

async function loadMonth(y, m) {
  const key = keyFor(y, m);
  if (workedData[key] !== undefined) return workedData[key];
  const raw = await cloudGet(key);
  workedData[key] = raw ? JSON.parse(raw) : [];
  return workedData[key];
}

async function loadSalary(y, m) {
  const key = salaryKeyFor(y, m);
  if (salaryData[key] !== undefined) return salaryData[key];
  const raw = await cloudGet(key);
  salaryData[key] = raw ? Number(raw) : 0;
  return salaryData[key];
}

async function persistSalary(y, m, value) {
  const key = salaryKeyFor(y, m);
  salaryData[key] = value;
  setStatus("Saqlanmoqda...", "");
  try {
    await cloudSet(key, String(value));
    setStatus("Saqlandi ✓", "ok");
    setTimeout(() => setStatus("", ""), 1200);
  } catch (e) {
    setStatus("Xatolik: " + e.message, "fail");
  }
}

function setStatus(msg, cls) {
  const el = document.getElementById("statusMsg");
  if (el) { el.textContent = msg; el.className = "status" + (cls ? " " + cls : ""); }
}

async function persistMonth(y, m) {
  const key = keyFor(y, m);
  setStatus("Saqlanmoqda...", "");
  try {
    await cloudSet(key, JSON.stringify(workedData[key]));
    setStatus("Saqlandi ✓", "ok");
    setTimeout(() => setStatus("", ""), 1200);
  } catch (e) {
    setStatus("Xatolik: " + e.message, "fail");
  }
}

async function render() {
  const y = current.getFullYear();
  const m = current.getMonth();
  document.getElementById("monthLabel").textContent = monthNames[m] + " " + y;
  const worked = await loadMonth(y, m);

  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";
  const firstDay = (new Date(y, m, 1).getDay() + 6) % 7; // 0=Dushanba ... 6=Yakshanba
  const daysInMonth = new Date(y, m+1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const e = document.createElement("div"); e.className = "day empty"; grid.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement("div");
    cell.className = "day" + (worked.includes(d) ? " worked" : "");
    cell.textContent = d;
    cell.onclick = () => toggleDay(d);
    grid.appendChild(cell);
  }
  document.getElementById("workedCount").textContent = worked.length;

  const salary = await loadSalary(y, m);
  const salaryInput = document.getElementById("salaryInput");
  salaryInput.value = salary ? salary.toLocaleString("en-US") : "";
}

function parseSalaryInput(str) {
  return Number(String(str).replace(/[^0-9]/g, "")) || 0;
}

function onSalaryInput() {
  const input = document.getElementById("salaryInput");
  const raw = parseSalaryInput(input.value);
  const cursorFromEnd = input.value.length - input.selectionStart;
  input.value = raw ? raw.toLocaleString("en-US") : "";
  const pos = Math.max(0, input.value.length - cursorFromEnd);
  input.setSelectionRange(pos, pos);
}

async function onSalaryDone() {
  document.getElementById("salaryInput").blur();
  const y = current.getFullYear();
  const m = current.getMonth();
  const val = parseSalaryInput(document.getElementById("salaryInput").value);
  await persistSalary(y, m, val);
}

async function onSalaryChange() {
  const y = current.getFullYear();
  const m = current.getMonth();
  const val = parseSalaryInput(document.getElementById("salaryInput").value);
  await persistSalary(y, m, val);
}

async function toggleDay(d) {
  const y = current.getFullYear();
  const m = current.getMonth();
  const key = keyFor(y, m);
  const idx = workedData[key].indexOf(d);
  if (idx === -1) workedData[key].push(d); else workedData[key].splice(idx, 1);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  await persistMonth(y, m);
  render();
}

function changeMonth(delta) { current.setMonth(current.getMonth() + delta); render(); }

async function resetMonth() {
  const y = current.getFullYear();
  const m = current.getMonth();
  workedData[keyFor(y, m)] = [];
  await persistMonth(y, m);
  render();
}

async function renderYear() {
  document.getElementById("yearLabel").textContent = viewYear;
  const list = document.getElementById("yearList");
  list.innerHTML = "";
  let total = 0;
  let totalSalary = 0;
  for (let m = 0; m < 12; m++) {
    const worked = await loadMonth(viewYear, m);
    const salary = await loadSalary(viewYear, m);
    total += worked.length;
    totalSalary += salary;
    const row = document.createElement("div");
    row.className = "yearRow";
    row.innerHTML = `<span class="mName">${monthNames[m]}</span><span class="mDays">${worked.length} kun</span><span class="mSalary">${salary ? salary.toLocaleString("ko-KR") + " won" : "—"}</span>`;
    list.appendChild(row);
  }
  document.getElementById("yearTotalCount").textContent = total + " kun";
  document.getElementById("yearTotalSalary").textContent = totalSalary.toLocaleString("ko-KR") + " won";
}

function changeYear(delta) { viewYear += delta; renderYear(); }

function showView(v) {
  document.getElementById("monthView").style.display = v === "month" ? "block" : "none";
  document.getElementById("yearView").style.display = v === "year" ? "block" : "none";
  document.getElementById("tabMonth").classList.toggle("active", v === "month");
  document.getElementById("tabYear").classList.toggle("active", v === "year");
  if (v === "year") renderYear();
}

render();
</script>
</body>
</html>
